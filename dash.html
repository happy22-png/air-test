<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제주도 산업지표 대시보드</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #ff9f43;
            --secondary: #00d2d3;
            --dark: #2d3436;
            --light: #f9f9f9;
            --accent: #ee5253;
        }
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            color: var(--dark);
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 40px;
        }
        header h1 {
            color: var(--primary);
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
            transition: transform 0.3s;
        }
        .stat-card:hover { transform: translateY(-5px); }
        .stat-card i { font-size: 2.5rem; color: var(--primary); margin-bottom: 15px; }
        .stat-card .value { font-size: 1.8rem; font-weight: bold; display: block; }
        .stat-card .label { color: #636e72; font-size: 0.9rem; }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 30px;
        }
        .chart-container {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .chart-container h3 { margin-top: 0; color: var(--dark); border-left: 5px solid var(--secondary); padding-left: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-island-tropical"></i> 제주도 산업지표 인포그래픽</h1>
            <p>2016년 - 2024년 주요 경제 및 산업 데이터 현황</p>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <i class="fas fa-chart-line"></i>
                <span class="value">26.9조</span>
                <span class="label">2024년 지역내총생산(GRDP)</span>
            </div>
            <div class="stat-card">
                <i class="fas fa-users"></i>
                <span class="value">1,585만</span>
                <span class="label">최대 관광객 수 (2016년)</span>
            </div>
            <div class="stat-card">
                <i class="fas fa-store"></i>
                <span class="value">100,168개</span>
                <span class="label">2024년 사업체 수</span>
            </div>
            <div class="stat-card">
                <i class="fas fa-percentage"></i>
                <span class="value">2.38%</span>
                <span class="label">평균 경제성장률</span>
            </div>
        </div>

        <div class="charts-grid">
            <div class="chart-container">
                <h3>GRDP 및 경제성장률 추이</h3>
                <canvas id="grdpChart"></canvas>
            </div>
            <div class="chart-container">
                <h3>관광객 수 vs 감귤 생산량</h3>
                <canvas id="touristChart"></canvas>
            </div>
            <div class="chart-container">
                <h3>소비자 물가지수 변화</h3>
                <canvas id="cpiChart"></canvas>
            </div>
            <div class="chart-container">
                <h3>사업체 현황 증가 추세</h3>
                <canvas id="businessChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        const years = [2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024];
        
        // GRDP & Growth Rate
        new Chart(document.getElementById('grdpChart'), {
            type: 'bar',
            data: {
                labels: years,
                datasets: [{
                    label: 'GRDP (백만원)',
                    data: [20020100, 21672308, 22040507, 22267086, 21668785, 22757094, 24282333, 26094554, 26928491],
                    backgroundColor: 'rgba(255, 159, 67, 0.6)',
                    yAxisID: 'y'
                }, {
                    label: '성장률 (%)',
                    data: [7.0, 6.9, 0.9, 0.8, -5.6, 3.1, 4.6, 3.3, 0.4],
                    type: 'line',
                    borderColor: '#ee5253',
                    yAxisID: 'y1'
                }]
            },
            options: { scales: { y: { type: 'linear', position: 'left' }, y1: { type: 'linear', position: 'right', grid: { drawOnChartArea: false } } } }
        });

        // Tourists & Tangerines
        new Chart(document.getElementById('touristChart'), {
            type: 'line',
            data: {
                labels: years,
                datasets: [{
                    label: '관광객수',
                    data: [15852980, 14753236, 14313961, 15286136, 10236445, 12008437, 13889502, 13370529, 13767350],
                    borderColor: '#00d2d3',
                    fill: false
                }, {
                    label: '감귤생산량',
                    data: [599642, 576722, 607638, 631310, 654864, 613118, 581858, 579432, 540906],
                    borderColor: '#ff9f43',
                    fill: false
                }]
            }
        });

        // CPI
        new Chart(document.getElementById('cpiChart'), {
            type: 'line',
            data: {
                labels: years,
                datasets: [{
                    label: '소비자 물가지수',
                    data: [95.37, 97.55, 99.25, 99.57, 100.0, 102.63, 108.71, 111.95, 113.97],
                    backgroundColor: 'rgba(0, 210, 211, 0.2)',
                    borderColor: '#00d2d3',
                    fill: true
                }]
            }
        });

        // Businesses
        new Chart(document.getElementById('businessChart'), {
            type: 'bar',
            data: {
                labels: years,
                datasets: [{
                    label: '사업체 수',
                    data: [57791, 60063, 62871, 66098, 94001, 96131, 96334, 99122, 100168],
                    backgroundColor: '#54a0ff'
                }]
            }
        });
    </script>
</body>
</html>
