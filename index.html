<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>엑셀 데이터 결합 대시보드</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6 font-sans">
    <div class="max-w-5xl mx-auto bg-white p-8 rounded-lg shadow-md">
        <h1 class="text-2xl font-bold mb-6 text-gray-800">엑셀 데이터 결합 대시보드</h1>
        
        <div id="dropZone" class="mb-4 border-4 border-dashed border-gray-300 rounded-lg p-10 text-center hover:border-blue-500 transition cursor-pointer">
            <p class="text-gray-600 mb-2">파일을 이곳으로 드래그하거나</p>
            <input type="file" id="fileInput" multiple accept=".xlsx, .xls, .csv" class="hidden">
            <button onclick="document.getElementById('fileInput').click()" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition">파일 선택</button>
        </div>

        <div id="progressArea" class="mb-6 hidden">
            <div class="w-full bg-gray-200 rounded-full h-4 overflow-hidden">
                <div id="progressBar" class="bg-blue-600 h-4 w-0 transition-all duration-300"></div>
            </div>
            <p id="progressText" class="text-xs text-gray-500 mt-2 text-right">0%</p>
        </div>

        <div id="fileListArea" class="mb-6 bg-gray-50 p-4 rounded-lg hidden">
            <h3 class="font-semibold text-gray-700 mb-2">선택된 파일 목록:</h3>
            <ul id="fileList" class="list-disc list-inside text-sm text-gray-600"></ul>
            <div class="mt-4 flex gap-2">
                <button id="mergeBtn" class="bg-green-600 text-white px-6 py-2 rounded-lg hover:bg-green-700 transition">데이터 합치기</button>
                <button id="downloadBtn" class="bg-purple-600 text-white px-6 py-2 rounded-lg hover:bg-purple-700 transition hidden">엑셀로 다운로드</button>
            </div>
        </div>

        <div id="resultArea" class="hidden">
            <h2 class="text-lg font-semibold mb-4">결합된 데이터 결과</h2>
            <div class="overflow-x-auto border border-gray-200 rounded-lg">
                <table id="resultTable" class="min-w-full divide-y divide-gray-200 text-sm">
                    <thead class="bg-gray-100"></thead>
                    <tbody class="bg-white divide-y divide-gray-200"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let allData = [];
        let fileNames = [];
        
        const processFiles = async (files) => {
            if (files.length === 0) return;
            document.getElementById('progressArea').classList.remove('hidden');
            
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                if (fileNames.includes(file.name)) continue;
                
                fileNames.push(file.name);
                const data = await new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
                        resolve(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]));
                    };
                    reader.readAsArrayBuffer(file);
                });
                allData.push(...data);
                
                const percent = Math.round(((i + 1) / files.length) * 100);
                document.getElementById('progressBar').style.width = percent + '%';
                document.getElementById('progressText').innerText = percent + '% 완료';
            }
            updateFileList();
        };

        const updateFileList = () => {
            const list = document.getElementById('fileList');
            list.innerHTML = fileNames.map(name => `<li class="break-all">${name}</li>`).join('');
            document.getElementById('fileListArea').classList.remove('hidden');
        };

        document.getElementById('dropZone').addEventListener('drop', (e) => {
            e.preventDefault();
            processFiles(e.dataTransfer.files);
        });
        document.getElementById('dropZone').addEventListener('dragover', (e) => e.preventDefault());
        document.getElementById('fileInput').addEventListener('change', (e) => processFiles(e.target.files));

        document.getElementById('mergeBtn').addEventListener('click', () => {
            if (allData.length === 0) return;
            const head = document.querySelector('#resultTable thead');
            const body = document.querySelector('#resultTable tbody');
            const cols = Object.keys(allData[0]);
            
            head.innerHTML = `<tr>${cols.map(c => `<th class="px-6 py-3 text-left font-bold text-gray-700">${c}</th>`).join('')}</tr>`;
            body.innerHTML = allData.map(row => `<tr>${cols.map(c => `<td class="px-6 py-4 text-gray-800">${row[c] !== undefined ? row[c] : ''}</td>`).join('')}</tr>`).join('');
            document.getElementById('resultArea').classList.remove('hidden');
            document.getElementById('downloadBtn').classList.remove('hidden');
        });

        document.getElementById('downloadBtn').addEventListener('click', () => {
            const ws = XLSX.utils.json_to_sheet(allData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "CombinedData");
            XLSX.writeFile(wb, "merged_data.xlsx");
        });
    </script>
</body>
</html>
