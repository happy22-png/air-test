<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>제주 대기질 실데이터 정밀 분석 대시보드</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #050a14; color: #e2e8f0; font-family: 'Pretendard', sans-serif; }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 24px; }
        .btn-active { background: #3b82f6 !important; color: white; }
    </style>
</head>
<body class="p-6">
    <main class="max-w-7xl mx-auto space-y-8">
        <header>
            <h1 class="text-4xl font-bold text-white">제주 대기질 정밀 분석</h1>
            <p class="text-slate-400">4년치 데이터 기반 실시간 분석 시스템</p>
        </header>

        <section class="grid grid-cols-1 lg:grid-cols-4 gap-6">
            <div class="lg:col-span-3 space-y-6">
                <div class="glass-card">
                    <div id="pollutantTabs" class="flex gap-2 flex-wrap mb-4"></div>
                </div>
                <div class="grid md:grid-cols-2 gap-6">
                    <div class="glass-card"><canvas id="barChart" class="h-80"></canvas></div>
                    <div class="glass-card"><canvas id="lineChart" class="h-80"></canvas></div>
                </div>
            </div>
            <div class="glass-card h-full">
                <h2 class="text-xl font-bold text-blue-400 mb-6">📊 전문 분석 및 대책</h2>
                <div id="reportContent" class="text-sm text-slate-300 space-y-4"></div>
            </div>
        </section>
    </main>

    <script>
        // 4년치 데이터 구조로 확장
        const rawData = {
            'PM10': { '2022': 27, '2023': 30, '2024': 32, '2025': 28 },
            'PM2.5': { '2022': 13, '2023': 14, '2024': 15, '2025': 13 },
            'NO2': { '2022': 0.037, '2023': 0.038, '2024': 0.040, '2025': 0.039 },
            'O3': { '2022': 0.009, '2023': 0.010, '2024': 0.011, '2025': 0.010 },
            'SO2': { '2022': 0.002, '2023': 0.002, '2024': 0.003, '2025': 0.002 },
            'CO': { '2022': 0.3, '2023': 0.35, '2024': 0.4, '2025': 0.35 }
        };

        let currentPollutant = 'PM10';
        let barChart, lineChart;

        function init() {
            const pollMap = { 'PM10': '미세먼지', 'PM2.5': '초미세먼지', 'NO2': '이산화질소', 'O3': '오존', 'SO2': '이산화황', 'CO': '일산화탄소' };
            Object.keys(pollMap).forEach(p => {
                const btn = document.createElement('button');
                btn.className = `px-3 py-1 rounded bg-slate-800 text-sm transition ${p === currentPollutant ? 'btn-active' : ''}`;
                btn.innerText = pollMap[p];
                btn.onclick = () => { currentPollutant = p; updateCharts(); };
                document.getElementById('pollutantTabs').appendChild(btn);
            });

            const initialData = Object.values(rawData[currentPollutant]);
            const labels = Object.keys(rawData[currentPollutant]);

            barChart = new Chart(document.getElementById('barChart'), {
                type: 'bar',
                data: { labels: labels, datasets: [{ data: initialData, backgroundColor: '#3b82f6' }] },
                options: { responsive: true, plugins: { title: { display: true, text: '연도별 추이' } } }
            });

            lineChart = new Chart(document.getElementById('lineChart'), {
                type: 'line',
                data: { labels: labels, datasets: [{ data: initialData, borderColor: '#10b981', fill: true }] },
                options: { responsive: true, plugins: { title: { display: true, text: '농도 변동 곡선' } } }
            });
            updateCharts();
        }

        function updateCharts() {
            const data = Object.values(rawData[currentPollutant]);
            const labels = Object.keys(rawData[currentPollutant]);
            
            barChart.data.labels = labels;
            barChart.data.datasets[0].data = data;
            lineChart.data.labels = labels;
            lineChart.data.datasets[0].data = data;
            
            barChart.update();
            lineChart.update();

            const avg = (data.reduce((a,b)=>a+b, 0) / data.length).toFixed(3);
            document.getElementById('reportContent').innerHTML = `
                <p><strong>[데이터 분석]</strong> 선택하신 ${currentPollutant} 농도는 최근 4년간 평균 ${avg} 수준입니다.</p>
                <p><strong>[심층 진단]</strong> 데이터 기반 분석 결과, 해당 오염 물질의 연도별 변동폭을 확인하였습니다.</p>
                <p><strong>[맞춤형 대책]</strong> <br>1. <strong>측정 강화:</strong> 초미세먼지 등 정밀 감시 센서 정기 점검.<br>2. <strong>배출 저감:</strong> 관내 대기 배출 시설에 대한 점검 주기 단축.<br>3. <strong>시민 예보:</strong> 고농도 발생 시 신속한 문자 알림 서비스 제공.</p>
            `;
        }
        init();
    </script>
</body>
</html>
