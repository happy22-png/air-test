<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제주 대기질 종합 분석 대시보드</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">
    <div class="max-w-6xl mx-auto px-4 py-8">
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-extrabold text-slate-900 mb-2">제주 대기질 정밀 분석 시스템</h1>
            <p class="text-slate-500">지역 및 물질별 다각도 비교 분석</p>
        </header>

        <div class="grid md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <label class="block text-sm font-semibold text-slate-700 mb-2">오염물질</label>
                <select id="pollutantSelect" class="w-full p-3 bg-slate-50 border rounded-lg">
                    <option value="pm10">미세먼지 (PM10)</option>
                    <option value="pm25">초미세먼지 (PM2.5)</option>
                    <option value="no2">이산화질소 (NO2)</option>
                </select>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <label class="block text-sm font-semibold text-slate-700 mb-2">연도</label>
                <select id="yearSelect" class="w-full p-3 bg-slate-50 border rounded-lg">
                    <option value="0">2022</option>
                    <option value="1">2023</option>
                    <option value="2">2024</option>
                </select>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <label class="block text-sm font-semibold text-slate-700 mb-2">지역 (최대 3개)</label>
                <select id="regionSelect" multiple class="w-full p-3 bg-slate-50 border rounded-lg h-24">
                    <!-- JavaScript로 생성 -->
                </select>
            </div>
        </div>

        <div class="grid lg:grid-cols-2 gap-8 mb-8">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <h2 class="text-lg font-bold mb-4 text-blue-600">비교 분석 그래프</h2>
                <div class="h-64"><canvas id="mainChart"></canvas></div>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <h2 class="text-lg font-bold mb-4 text-emerald-600">연도별 추이 분석 (통찰력)</h2>
                <div class="h-64"><canvas id="insightChart"></canvas></div>
            </div>
        </div>
    </div>

    <script>
        const regions = ['강정동', '남원읍', '대정읍', '동홍동', '성산읍', '애월읍', '연동', '이도동', '조천읍', '한림읍', '화북동'];
        const dataMap = {
            'pm10': [26,28,22, 24,29,28, 27,30,24, 26,31,25, 28,32,26, 27.5,31,28, 29,34,29, 31,35,26, 28,35,27, 26,32,26, 27,30,27],
            'pm25': [14,13,11, 12,13,13, 14,15,11, 11,13,13, 14,15,13, 15.5,12,11, 15,16,14, 16,14,13, 16,14,12, 16,14,14, 13,13,14],
            'no2': [0.005,0.0057,0.0049, 0.004,0.0042,0.0051, 0.005,0.0056,0.0054, 0.007,0.0067,0.007, 0.005,0.0051,0.005, 0.0085,0.005,0.0052, 0.01,0.0097,0.0095, 0.01,0.0106,0.0101, 0.007,0.0066,0.0062, 0.007,0.007,0.007, 0.009,0.0091,0.0077]
        };

        const regionSelect = document.getElementById('regionSelect');
        regions.forEach((r, i) => {
            const opt = document.createElement('option');
            opt.value = i;
            opt.textContent = r;
            if(i < 3) opt.selected = true;
            regionSelect.appendChild(opt);
        });

        let mainChart, insightChart;
        function update() {
            const p = document.getElementById('pollutantSelect').value;
            const y = parseInt(document.getElementById('yearSelect').value);
            const selectedRegions = Array.from(regionSelect.selectedOptions).map(o => parseInt(o.value));
            
            const mainCtx = document.getElementById('mainChart').getContext('2d');
            if(mainChart) mainChart.destroy();
            mainChart = new Chart(mainCtx, {
                type: 'bar',
                data: {
                    labels: selectedRegions.map(i => regions[i]),
                    datasets: [{ label: '농도', data: selectedRegions.map(i => dataMap[p][i*3 + y]), backgroundColor: '#3b82f6' }]
                }
            });

            const insightCtx = document.getElementById('insightChart').getContext('2d');
            if(insightChart) insightChart.destroy();
            insightChart = new Chart(insightCtx, {
                type: 'line',
                data: {
                    labels: ['2022', '2023', '2024'],
                    datasets: selectedRegions.map(i => ({
                        label: regions[i],
                        data: [dataMap[p][i*3], dataMap[p][i*3+1], dataMap[p][i*3+2]],
                        tension: 0.3
                    }))
                }
            });
        }

        document.querySelectorAll('select').forEach(s => s.addEventListener('change', update));
        update();
    </script>
</body>
</html>
